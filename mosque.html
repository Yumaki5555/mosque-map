var MAP_PAGE = "index.html", DON_PAGE = "donation.html";
var BY_ID = {}; DATA.forEach(function (d) { BY_ID[d.id] = d; });
var map = null, marker = null;
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
  return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
// 検索用: 全角・半角、大文字・小文字、ひらがな・カタカナ、空白や「・」の違いは気にせず探す
function norm(s) {
  return String(s).normalize("NFKC").toLowerCase()
    .replace(/[\u3041-\u3096]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); })
    .replace(/[\s・･\-‐－]/g, "");
}
function host(u) { return u.replace(/^https?:\/\/(www\.)?/, "").split("/")[0]; }
function dl(rows) { return "<dl>" + rows.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("") + "</dl>"; }
// 系統の札（色は系統ごとに違う）
function netBadges(d) {
  return d.net.map(function (k) { return "<span class='net' style='background:" + NETS[k].color + "'>" + esc(NETS[k].short) + "</span>"; }).join("");
}
// 国籍・宗派の1行（根拠と出典つき。分からなければ「不明」）
function feat(d, item) {
  var xs = (d.feat || {})[item] || [];
  if (!xs.length) return "<span class='empty'>不明</span>";
  return xs.map(function (x) {
    return (x[1] === "推定" ? "<span class='est'>推定</span>" : "") + esc(x[0]) +
           "<span class='src'>根拠: " + esc(x[2]) + (x[3] ? "　<a href='" + esc(x[3]) + "' target='_blank' rel='noopener'>出典を見る</a>" : "") + "</span>";
  }).join("");
}

  var nk = Object.keys(NETS);

  if (nk.length) html += "<p class='note'>色つきの札は、同じ団体が運営する複数のモスクのグループ（系統）です。色は系統ごとに分けています。" +

      ms.map(function (d) {
        return "<li data-q='" + esc(norm(d.n + d.a + d.kw)) + "' data-net='" + d.net.join(" ") + "'><a href='#" + d.id + "'><span class='dot' style='background:" +

               (d.net.length ? "<br>" + netBadges(d) : "") + "</a></li>";
      }).join("") + "</ul></details>";
  });
  html += "<p class='empty' id='none' style='display:none'>見つかりませんでした。別の言葉で探してみてください。</p>";
  document.getElementById("main").innerHTML = html;
  var box = document.getElementById("search"), secs = document.querySelectorAll("details.pref-sec");
  // 検索中は、見つかったモスクのある都道府県だけを開いて出す（検索をやめると、開け閉めは元に戻る）
  function filter() {
    QUERY = box.value;
    // 空白で区切ると「どれも含む」で絞り込む。系統の名前ちょうどなら、その系統のモスクだけを出す（上の札を押したとき）
    var terms = QUERY.split(/[\s　]+/).map(norm).filter(Boolean), q = terms.length > 0, total = 0;

    secs.forEach(function (sec) {
      var shown = 0, cnt = sec.querySelector(".cnt");

        li.style.display = ok ? "" : "none"; if (ok) shown++;
      });
      total += shown;
      sec.style.display = shown ? "" : "none";
      sec.open = q ? shown > 0 : !!OPEN[sec.getAttribute("data-pref")];
      cnt.textContent = q ? cnt.getAttribute("data-n") + "件中 " + shown + "件が見つかりました" : cnt.getAttribute("data-n") + "件";
    });
    document.getElementById("none").style.display = total ? "none" : "";
  }
  secs.forEach(function (sec) {
    // 自分で開け閉めしたものだけ覚えておく（検索で自動的に開いたものは覚えない）
    sec.addEventListener("toggle", function () { if (!box.value.trim()) OPEN[sec.getAttribute("data-pref")] = sec.open; });

}

    "<a href='" + MAP_PAGE + "#" + d.id + "'>← 地図でこのモスクを見る</a><a class='list' href='#'>モスクの一覧</a>" +
    "<a class='don' href='" + DON_PAGE + "'>¥ 寄付状況ページ</a>";
  var h = "<div class='pref'>" + esc(d.p) + "</div><h1>" + esc(d.n) + "</h1>" +
          "<span class='zone' style='background:" + d.c + "'>" + esc(d.zg) + "</span> " + netBadges(d);
  // 写真（ウィキメディア・コモンズ。撮影者とライセンスを必ず添える）
  if (d.ph) h += "<figure class='ph'><img src='" + esc(d.ph["画像URL"]) + "' alt='" + esc(d.n) + "の写真' loading='lazy'>" +
       "<figcaption>写真: " + esc(d.ph["撮影者"] || "撮影者不明") + "（<a href='" + esc(d.ph["ライセンスURL"] || d.ph["ファイルページ"]) +
       "' target='_blank' rel='noopener'>" + esc(d.ph["ライセンス"]) + "</a>）／ <a href='" + esc(d.ph["ファイルページ"]) +
       "' target='_blank' rel='noopener'>ウィキメディア・コモンズ</a></figcaption></figure>";
  // 基本情報
  h += "<div class='card'><h2>基本情報</h2>" + dl([["推定住所", d.a], ["区域区分", d.z]]) +
       "<p class='note'>" + esc(ZONE_NOTE[d.zg] || "") + "</p>" +
       (d.rm ? "<p class='warn'>※Googleマップからは登録が削除されています</p>" : "") +
       d.nt.map(function (t) {
         return "<p class='st-note'>" + esc(t) + (d.ns ? "　<a href='" + esc(d.ns) + "' target='_blank' rel='noopener'>出典を見る</a>" : "") + "</p>";
       }).join("") +
       "<div id='map'></div><a href='" + esc(d.g) + "' target='_blank' rel='noopener'>" + esc(d.gl) + "</a>" +
       "<span class='note'>（住所は都道府県・市区町村までの推定です。ピンの位置はおおよそのことがあります）</span></div>";
  // 運営団体（組み立て済みのHTML）
  h += "<div class='card'><h2>運営団体</h2>" + d.org + "</div>";
  // 国籍・宗派（根拠のあるものだけ。なければ「不明」）
  h += "<div class='card'><h2>国籍・宗派</h2><dl><dt>主な国籍・出身</dt><dd>" + feat(d, "国籍") + "</dd>" +
       "<dt>宗派</dt><dd>" + feat(d, "宗派") + "</dd></dl>" +
       "<p class='note'>運営している人や利用者の出身国・宗派です。公式サイト・報道・法人の登録名などで確かめられたものだけを載せ、" +
       "分からないものは「不明」としています" + (PRIVATE ? "（自分用は「推定」も表示）" : "") + "。</p></div>";
  // 系統（同じ団体が運営する、ほかの場所のモスク）
  d.net.forEach(function (k) {
    var n = NETS[k], me = n.m.filter(function (x) { return x[0] === d.id; })[0];
    h += "<div class='card' style='border-left:6px solid " + n.color + "'><h2>系統：" + esc(n.name) + "</h2><p class='note'>" + esc(n.desc) + "</p>" +
         (me ? "<span class='src'>" + (me[2] === "推定" ? "<span class='est'>推定</span>" : "") + "このモスクの根拠: " + esc(me[3]) +
               (me[4] ? "　<a href='" + esc(me[4]) + "' target='_blank' rel='noopener'>出典を見る</a>" : "") + "</span>" : "") +
         "同じ系統のモスク（" + n.m.length + "か所）<ul class='sib'>" + n.m.map(function (x) {
           return x[0] === d.id ? "<li class='me'>" + esc(x[1]) + "（このモスク）</li>"
                : "<li><a href='#" + x[0] + "'>" + esc(x[1]) + "</a>" + (x[2] === "推定" ? " <span class='est'>推定</span>" : "") + "</li>";
         }).join("") + "</ul></div>";
  });
  // ホームページ・SNS
  h += "<div class='card'><h2>ホームページ・SNS</h2>" + (d.links.length ?
       "<ul class='links'>" + d.links.map(function (l) {
         return "<li>" + esc(l[0]) + "：<a href='" + esc(l[1]) + "' target='_blank' rel='noopener'>" + esc(host(l[1])) + " を開く</a></li>";
       }).join("") + "</ul>" : "<span class='empty'>まだ分かっていません（情報提供をお待ちしています）</span>") + "</div>";
  if (d.info.length) h += "<div class='card'><h2>そのほかの情報</h2>" + dl(d.info) + "</div>";
  // 寄付
  h += "<div class='card'><h2>¥ 寄付の募集</h2>" + (d.don ?
       "<ul class='don-list'>" + d.don + "</ul><p class='note'>名前を押すと、寄付状況ページの詳しい説明に移ります。</p>" :
       "<span class='empty'>このモスクの寄付の募集情報は、いまのところ見つかっていません。</span>") + "</div>";
  // 自分用
  if (d.memo && d.memo.length) h += "<div class='card priv'><h2>調べかけのメモ（自分用）</h2>" + dl(d.memo) + "</div>";
  if (d.yd) h += "<div class='card priv'><h2>周辺3kmの中古車ヤード候補（自分用）</h2>" + (d.yd.length ?
       "<ul class='links'>" + d.yd.map(function (y) {
         return "<li>" + esc(y[0]) + " <span class='host'>" + y[1] + "km" + (y[2] ? "" : "・名前からは断定しにくい") +
                "</span> <a href='" + esc(y[3]) + "' target='_blank' rel='noopener'>出典</a></li>";
       }).join("") + "</ul><p class='note'>OpenStreetMapに登録された名前だけから機械的に拾ったものです（未確認）。</p>" :
       "<span class='empty'>なし</span>") + "</div>";
  document.getElementById("main").innerHTML = h;
  // 小さな地図（そのモスクの周り）
  if (window.L) {
    if (map) map.remove();
    map = L.map("map", { scrollWheelZoom: false }).setView([d.la, d.lo], 15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
    L.circleMarker([d.la, d.lo], { radius: 11, color: "#fff", weight: 2.5, fillColor: d.c, fillOpacity: 0.9 })
      .addTo(map).bindTooltip(d.n);
  } else {
    document.getElementById("map").style.display = "none";
  }
}

function route() {
  var d = BY_ID[decodeURIComponent(location.hash.slice(1))];
  if (d) showMosque(d); else showList();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>

<button type="button" id="to-top" aria-label="ページの上に戻る">↑<span>上へ</span></button>
<style>
  #to-top { position: fixed; right: 16px; bottom: 20px; z-index: 1100; width: 58px; height: 58px; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid #fff; border-radius: 50%; background: #2f5d8a; color: #fff; cursor: pointer;
            font: 700 22px/1 sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.35);
            opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
  #to-top span { font-size: 11px; margin-top: 3px; }
  #to-top.show { opacity: .95; visibility: visible; }
  #to-top:hover { background: #1e3a5f; }
  @media print { #to-top { display: none; } }
</style>
<script>
(function () {
  var b = document.getElementById("to-top");
  function update() { b.classList.toggle("show", window.scrollY > 400); }
  window.addEventListener("scroll", update, { passive: true });
  update();
  b.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
})();
</script>
